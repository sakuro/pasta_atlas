<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Maintenance - Pasta Atlas</title>
  <link rel="icon" href="/assets/favicon.ico">
  <!-- Served by a CloudFront Function, which embeds this file; keep it self-contained and small (10 KB code limit). -->
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #4a4a4a;
      --strong: #363636;
      --muted: #7a7a7a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #14161a;
        --text: #b5b5b5;
        --strong: #f5f5f5;
        --muted: #8a8f99;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 36rem;
    }

    .app-name {
      margin: 0 0 1.5rem;
      color: var(--strong);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .status {
      margin: 0;
      color: var(--muted);
      font-size: 0.875rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      color: var(--strong);
      font-size: 1.5rem;
      line-height: 1.3;
    }

    p {
      margin: 0 0 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="app-name">Pasta Atlas</p>
    <p class="status">503 Service Unavailable</p>
    <h1>Under maintenance</h1>
    <p>{{MESSAGE}}</p>
    {{ENDS_AT}}
  </main>
  <script>
    document.querySelectorAll("time[datetime]").forEach(function (el) {
      var date = new Date(el.getAttribute("datetime"));
      if (isNaN(date.getTime())) return;
      // No timeZone option, so the viewer's zone applies. dateStyle/timeStyle cannot be combined with timeZoneName.
      el.textContent = date.toLocaleString("en-US", { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
    });
  </script>
</body>
</html>
