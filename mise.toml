[env]
# Make the hooks run through `mise x`, so mise-managed tools resolve without shell activation,
# for example from a GUI git client.
HK_MISE = "1"
_.file = [".env", ".env.development", ".env.development.local", ".env.local"]
_.path = ["bin", "node_modules/.bin"]
_.fnox-env = { tools = true }

[hooks]
# Skipped in CI (GitHub Actions sets CI).
postinstall = 'test -n "$CI" || hk install'

[settings]
# Do not install a release that is younger than this, matching the Renovate setting.
minimum_release_age = "3d"

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[tools]
aws-cli = "2.40.3"
fnox = "1.48.0"
gitleaks = "8.30.1"
hk = "2.13.0"
node = "26.13.1"
ruby = "4.0.10"
terraform = "1.17.2"
tflint = "0.66.0"

[tasks.default]
depends = ["dev"]

[tasks.dev]
depends = ["web", "assets", "frontend", "floci", "s3-queue-worker"]

# `floci` starts PostgreSQL in parallel with the tasks that need it, so they wait here.
[tasks.wait-postgres]
run = "until docker compose exec -T postgres pg_isready -U pasta_atlas -q; do sleep 1; done"

# Floci answers before it has loaded its stored queues, and the worker would get "queue does not exist".
[tasks.wait-floci]
run = 'until aws sqs get-queue-attributes --queue-url "$SQS_S3_CLEANUP_QUEUE_URL" >/dev/null 2>&1; do sleep 1; done'

[tasks.web]
depends = ["wait-postgres"]
run = "bundle exec hanami server"

[tasks.assets]
run = "bundle exec hanami assets watch"

[tasks.frontend]
run = "npm run dev:frontend"

[tasks.floci]
run = "docker compose up"

[tasks.s3-queue-worker]
depends = ["wait-postgres", "wait-floci"]
run = "bundle exec rake s3:process_queues"
