#:schema https://pitchfork.jdx.dev/schema.json

[settings.general]
# Run each daemon through `mise x`, so the tools and the env of mise.toml (.env files, fnox) resolve
# no matter which shell started the supervisor.
mise = true

[daemons.floci]
run = "exec docker compose up"
# Floci answers before it has loaded its stored queues, and the worker would get "queue does not exist".
# The first start may pull the images.
ready_cmd = { run = 'aws sqs get-queue-attributes --queue-url "$SQS_S3_CLEANUP_QUEUE_URL" >/dev/null 2>&1', timeout = "5m" }

# The RDS instance is created by `terraform apply` and served by Floci.
# pg_isready succeeds even when the database does not exist, so connect to it once the server is up
# and fail with a hint instead of letting the dependent daemons crash on the missing database.
[daemons.database]
oneshot = true
depends = ["floci"]
run = '''
until pg_isready -h localhost -p 7001 -U pasta_atlas -q; do sleep 1; done
if ! psql "$DATABASE_URL" --quiet --command 'SELECT 1' >/dev/null; then
  echo "Cannot connect to the development database. Run 'mise run setup' to create it." >&2
  exit 1
fi
'''

[daemons.web]
run = "exec bundle exec hanami server"
depends = ["database"]
ready_port = 2300

[daemons.assets]
run = "exec bundle exec hanami assets watch"

[daemons.frontend]
run = "exec vite build --watch"

[daemons.s3-queue-worker]
run = "exec bundle exec rake s3:process_queues"
depends = ["database", "floci"]
