openapi: 3.1.0
info:
  title: pasta_atlas JSON API
  version: "1"
  description: |
    The JSON API used by the SPA. The OmniAuth endpoints, which redirect instead of answering JSON, are
    described in doc/architecture/api.md.
    Write responses inline under each operation (no `$ref` to `components/responses`): the RSpec
    matcher `conform_to_openapi` reads them by JSON pointer.
servers:
  - url: /
    description: The same origin as the SPA
paths:
  /api/v1/auth/current:
    get:
      operationId: getCurrentAuth
      summary: The current user and preferences, for the SPA on load
      description: >-
        A guest gets user null and empty preferences. A session whose user no longer exists is
        cleared of the user and answered as a guest.
      responses:
        "200":
          description: The current user, or null for a guest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, preferences]
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/UserInfo"
                      - type: "null"
                  preferences:
                    type: object
                    additionalProperties: false
                    required: [locale, timezone, relative_timestamps]
                    properties:
                      locale:
                        description: BCP 47 tag; null to use the browser's
                        type: [string, "null"]
                      timezone:
                        description: IANA identifier; null to use the browser's
                        type: [string, "null"]
                      relative_timestamps:
                        type: boolean
  /api/v1/auth/registration:
    get:
      operationId: getPendingRegistration
      summary: The OAuth identity waiting to be registered, for the registration form
      responses:
        "200":
          description: The pending identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [provider, login_name]
                properties:
                  provider:
                    $ref: "#/components/schemas/Provider"
                  login_name:
                    description: >-
                      The login name at the provider, lowercased, suggested as the user name; empty if
                      the provider gave none
                    type: string
        "403":
          description: No registration is pending
  /api/v1/maps:
    get:
      operationId: listMaps
      summary: Maps with at least one complete generation, most recently completed upload first
      parameters:
        - name: page
          in: query
          description: Page number; values below 1 or not an integer are treated as 1
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: One page of maps
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [maps, page, per_page, total]
                properties:
                  maps:
                    type: array
                    items:
                      $ref: "#/components/schemas/MapSummary"
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
  /api/v1/maps/lookup:
    get:
      operationId: lookupMap
      summary: Finds a map of the current user (guest or logged in) by its mapshot map id
      parameters:
        - name: mapshot_map_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The map exists
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name]
                properties:
                  name:
                    description: null if the map has no user-set name
                    type: [string, "null"]
        "404":
          description: No map for this user and mapshot map id
  /api/v1/maps/{ulid}:
    parameters:
      - $ref: "#/components/parameters/MapUlid"
    get:
      operationId: showMap
      summary: Map details with all complete generations
      responses:
        "200":
          description: The map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapDetail"
        "404":
          description: The map does not exist or has no complete generation
  /api/v1/maps/{ulid}/name:
    parameters:
      - $ref: "#/components/parameters/MapUlid"
    patch:
      operationId: updateMapName
      summary: Renames a map (own map only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  description: >-
                    Leading and trailing whitespace is stripped; at most 30 grapheme clusters; the same
                    character rule as the profile display name. An empty name clears the user-set name,
                    and display_name falls back to the savename or the mapshot map id.
                  type: string
      responses:
        "200":
          description: The map was renamed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [display_name]
                properties:
                  display_name:
                    type: string
        "400":
          description: The body is not valid JSON
        "403":
          description: Guest, or not the own map
        "404":
          description: The map does not exist
        "422":
          description: The name was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapNameError"
  /api/v1/maps/{ulid}/deletion_requests:
    parameters:
      - $ref: "#/components/parameters/MapUlid"
    post:
      operationId: requestMapDeletion
      summary: Deletes a map and queues its S3 prefix for cleanup (own map only)
      responses:
        "302":
          description: Deleted; the flash `map-deletion-requested` is set
          headers:
            Location:
              schema:
                type: string
                const: /
        "403":
          description: Guest, or not the own map
        "404":
          description: The map does not exist
  /api/v1/pages/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          enum: [about, privacy, terms]
    get:
      operationId: showPage
      summary: The HTML of a static page
      description: >-
        In the user's locale, or the language negotiated from Accept-Language, falling back to English.
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [content]
                properties:
                  content:
                    description: HTML written by the maintainers
                    type: string
        "404":
          description: The slug is not one of the above
  /api/v1/uploads:
    post:
      operationId: createUpload
      summary: Starts an upload, creating the map (if new for the user), the generation and the upload
      description: >-
        Logged-in users only. If a pending upload exists for the same generation, it is answered
        again with 201, so that an interrupted upload can be resumed. The name replaces the stored
        name of an existing map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, total_image_count, name]
              properties:
                metadata:
                  description: The content of mapshot.json, stored as it is
                  type: object
                  required: [map_id, unique_id, tick]
                  properties:
                    map_id:
                      type: string
                      pattern: "^[0-9a-f]{8}$"
                    unique_id:
                      type: string
                      pattern: "^[0-9a-f]{8}$"
                    tick:
                      description: A JSON integer; a number with a fraction part, such as 1000.0, is rejected too
                      type: integer
                      minimum: 0
                      maximum: 4294967295
                total_image_count:
                  description: A JSON integer; a number with a fraction part, such as 5.0, is rejected too
                  type: integer
                  minimum: 1
                  maximum: 10000
                name:
                  description: >-
                    Leading and trailing whitespace is stripped, and the stripped name must not be empty;
                    at most 30 grapheme clusters and the same character rule as updateMapName.
                  type: string
                  minLength: 1
      responses:
        "201":
          description: >-
            The upload: a new one, or the existing upload of the same generation if it is not complete
            (a failed upload from old data is answered too, and issuePresignedPosts then answers 422)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ulid, map_ulid, generation_ulid]
                properties:
                  ulid:
                    type: string
                  map_ulid:
                    type: string
                  generation_ulid:
                    type: string
        "400":
          description: >-
            The body is not valid JSON or does not match the schema (the string "5" or the float 5.0
            is rejected as total_image_count), or the name is empty after stripping
        "403":
          description: Guest
        "409":
          description: The generation already has a complete upload
        "422":
          description: The name was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapNameError"
        "502":
          description: >-
            mapshot.json could not be written to S3; the generation and the upload are rolled back, but a
            new map is kept and an existing map keeps the new name
  /api/v1/uploads/{ulid}:
    parameters:
      - $ref: "#/components/parameters/UploadUlid"
    patch:
      operationId: completeUpload
      summary: Completes an upload whose files are all verified (own upload only)
      description: Completing an upload that is already complete answers it again and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  const: complete
      responses:
        "200":
          description: The complete upload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ulid, status, completed_at]
                properties:
                  ulid:
                    type: string
                  status:
                    type: string
                    const: complete
                  completed_at:
                    type: string
                    format: date-time
        "400":
          description: The body is not valid JSON, or status is not complete
        "403":
          description: Not the own upload (the guest cannot create uploads, so this includes the guest)
        "404":
          description: The upload does not exist
        "422":
          description: Not every file has been verified, or the upload failed
  /api/v1/uploads/{ulid}/presigned_posts:
    parameters:
      - $ref: "#/components/parameters/UploadUlid"
    post:
      operationId: issuePresignedPosts
      summary: Issues presigned S3 POSTs for tile images of a pending upload (own upload only)
      description: >-
        Generated locally, without an S3 call. Each policy requires image/jpeg and 1 byte to 640 KB.
        Asking again for a file already issued is a retry and does not count toward total_image_count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filenames]
              properties:
                filenames:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    pattern: "^s[0-9]+zoom_[0-9]+/tile_-?[0-9]+_-?[0-9]+\\.jpg$"
      responses:
        "200":
          description: One presigned POST per distinct filename
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [presigned_posts]
                properties:
                  presigned_posts:
                    description: Keyed by filename
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PresignedPost"
        "400":
          description: The body is not valid JSON, or a filename is invalid, or there are more than 200
        "403":
          description: Not the own upload (the guest cannot create uploads, so this includes the guest)
        "404":
          description: The upload does not exist
        "422":
          description: >-
            The upload is not pending (checked before the owner), or the new filenames would take the
            files requested for the upload above its total_image_count
  /api/v1/uploads/{ulid}/verify_batch:
    parameters:
      - $ref: "#/components/parameters/UploadUlid"
    post:
      operationId: verifyUploadBatch
      summary: Checks that the files of one batch exist in S3 and records their sizes (own upload only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filenames]
              properties:
                filenames:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
      responses:
        "200":
          description: Every file exists
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified_bytes]
                properties:
                  verified_bytes:
                    description: The bytes of the objects of this batch (not a running total)
                    type: integer
        "400":
          description: The body is not valid JSON, or filenames is empty or has more than 200 entries
        "403":
          description: Guest, or not the own upload
        "404":
          description: The upload does not exist
        "422":
          description: >-
            verification_failed: an object is missing, so the generation is deleted and its S3 prefix
            is queued for cleanup. not_pending: the upload is not pending, and nothing is checked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [verification_failed, not_pending]
        "500":
          description: The cleanup message could not be queued; the generation is kept
  /api/v1/users/{user_name}:
    parameters:
      - $ref: "#/components/parameters/UserName"
    get:
      operationId: showUser
      summary: Public information of a user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/UserInfo"
        "403":
          description: The user is a system account (guest or compilatron)
        "404":
          description: The user does not exist
    delete:
      operationId: deleteUser
      summary: Deletes the own account, queues the S3 prefixes of its maps and avatar for cleanup and clears the session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_user_name]
              properties:
                confirm_user_name:
                  description: Must equal user_name
                  type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [redirect_to]
                properties:
                  redirect_to:
                    type: string
        "400":
          description: The body is not valid JSON, or confirm_user_name does not match user_name
        "403":
          description: Guest, or not the own account
        "502":
          description: A cleanup message could not be queued; the account is kept and the request can be repeated
  /api/v1/users/{user_name}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserName"
    delete:
      operationId: deleteAvatar
      summary: Removes the own avatar and queues its object for cleanup
      responses:
        "204":
          description: Removed (also when there was no avatar)
        "403":
          description: Guest, or not the own profile
  /api/v1/users/{user_name}/credentials:
    parameters:
      - $ref: "#/components/parameters/UserName"
    get:
      operationId: listCredentials
      summary: The OAuth providers and those linked to the own account
      responses:
        "200":
          description: The providers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers, connected_providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
                  connected_providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        "403":
          description: Guest, or not the own account
  /api/v1/users/{user_name}/credentials/{provider}:
    parameters:
      - $ref: "#/components/parameters/UserName"
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Provider"
    delete:
      operationId: unlinkCredential
      summary: Unlinks an OAuth provider from the own account
      responses:
        "204":
          description: Unlinked
        "403":
          description: Guest, or not the own account
        "404":
          description: The provider is not supported
        "422":
          description: It is the last credential of the account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [error-credential-last]
  /api/v1/users/{user_name}/maps:
    parameters:
      - $ref: "#/components/parameters/UserName"
    get:
      operationId: listRecentMapsOfUser
      summary: Up to 3 maps of the user that have a complete generation, most recently completed upload first
      responses:
        "200":
          description: The maps
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [maps]
                properties:
                  maps:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/MapSummary"
        "404":
          description: The user does not exist or is a system account (guest or compilatron)
  /api/v1/users/{user_name}/preferences:
    parameters:
      - $ref: "#/components/parameters/UserName"
    get:
      operationId: showPreferences
      summary: The own preferences
      responses:
        "200":
          description: The preferences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [timezone, timezone_identifiers, locale, relative_timestamps]
                properties:
                  timezone:
                    description: IANA identifier; null to use the browser's
                    type: [string, "null"]
                  timezone_identifiers:
                    description: Every IANA identifier the server accepts
                    type: array
                    items:
                      type: string
                  locale:
                    description: BCP 47 tag; null to use the browser's
                    type: [string, "null"]
                  relative_timestamps:
                    type: boolean
        "403":
          description: Guest, or not the own account
    patch:
      operationId: updatePreferences
      summary: Updates the own preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [relative_timestamps]
              properties:
                timezone:
                  description: IANA identifier; empty, null or unknown is stored as null
                  type: [string, "null"]
                locale:
                  description: Supported BCP 47 tag; empty, null or unsupported is stored as null
                  type: [string, "null"]
                relative_timestamps:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [locale]
                properties:
                  locale:
                    description: The stored locale
                    type: [string, "null"]
        "400":
          description: >-
            The body is not valid JSON or does not match the schema: relative_timestamps is missing or not
            a JSON boolean (the string "true" is rejected too), or timezone or locale is neither a string
            nor null
        "403":
          description: Guest, or not the own account
  /api/v1/users/{user_name}/profile:
    parameters:
      - $ref: "#/components/parameters/UserName"
    get:
      operationId: showProfile
      summary: The own profile as stored, for the edit form
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_name, display_name, avatar_url]
                properties:
                  user_name:
                    type: string
                  display_name:
                    description: null if not set (other endpoints fall back to user_name)
                    type: [string, "null"]
                  avatar_url:
                    type: [string, "null"]
        "403":
          description: Guest, or not the own profile
    patch:
      operationId: updateProfile
      summary: Updates the own display name and, optionally, the avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  description: >-
                    At most 30 grapheme clusters; no control characters, no whitespace other than a plain
                    space and no format characters other than ZWJ and variation selectors (the same rule as
                    map names). Empty clears it.
                  type: string
                avatar_s3_key:
                  description: >-
                    A key from createAvatarPresignedPost that is unexpired and not applied yet, whose object
                    is an image of the issued type within 5 MiB. It is checked before anything is written.
                    The previous avatar object is queued for cleanup. Empty or absent keeps the avatar.
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [display_name, avatar_url]
                properties:
                  display_name:
                    description: The display name, or user_name if it is not set
                    type: string
                  avatar_url:
                    type: [string, "null"]
        "400":
          description: The body is not valid JSON (the fields are not validated otherwise)
        "403":
          description: Guest, or not the own profile
        "422":
          description: The display name or the avatar was rejected; nothing is changed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: string
                    enum:
                      - error-profile-display-name-too-long
                      - error-profile-display-name-invalid-chars
                      - error-profile-avatar-invalid
        "502":
          description: S3 could not be reached to check the avatar object
  /api/v1/users/{user_name}/profile/avatar_presigned_post:
    parameters:
      - $ref: "#/components/parameters/UserName"
    post:
      operationId: createAvatarPresignedPost
      summary: Issues a presigned S3 POST for an avatar image (own profile only)
      description: >-
        The policy fixes the content type and limits the object to 5 MiB. The key is recorded for the
        user and valid for PRESIGNED_URL_EXPIRY seconds; it can be applied once, with updateProfile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type]
              properties:
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        "200":
          description: The presigned POST
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [presigned_post, s3_key]
                properties:
                  presigned_post:
                    $ref: "#/components/schemas/PresignedPost"
                  s3_key:
                    type: string
        "400":
          description: The body is not valid JSON, or the content type is missing or not supported
        "403":
          description: Guest, or not the own profile
        "429":
          description: The user holds 10 keys that are unexpired and not applied
  /auth/register:
    post:
      operationId: register
      summary: Registers the pending OAuth identity as a new user and logs in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, terms]
              properties:
                name:
                  description: >-
                    Lowercased, then at most 15 characters of ASCII letters, digits, - and _, starting and
                    ending with a letter or digit; guest, compilatron, api and admin are reserved
                  type: string
                timezone:
                  description: IANA identifier; empty, null, absent or unknown is stored as UTC
                  type: [string, "null"]
                terms:
                  description: Acceptance of the terms of service; must be true
                  type: boolean
      responses:
        "200":
          description: Registered; the session is reset and holds the new user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [redirect_to]
                properties:
                  redirect_to:
                    type: string
        "400":
          description: >-
            The body is not valid JSON or does not match the schema: name is missing or not a string,
            terms is missing or not a JSON boolean (the string "1" is rejected too), or timezone is
            neither a string nor null
        "403":
          description: No registration is pending
        "422":
          description: The terms were not accepted, or the name was rejected
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: string
                    enum:
                      - error-terms-required
                      - error-username-empty
                      - error-username-too-long
                      - error-username-invalid-chars
                      - error-username-reserved
                      - error-username-taken
components:
  parameters:
    MapUlid:
      name: ulid
      in: path
      required: true
      schema:
        type: string
    UploadUlid:
      name: ulid
      in: path
      required: true
      schema:
        type: string
    UserName:
      name: user_name
      in: path
      required: true
      schema:
        type: string
  schemas:
    Provider:
      type: string
      enum: [discord, github, steam]
    PresignedPost:
      description: >-
        Submit the file as multipart/form-data to url, with every field first and the file part last
      type: object
      additionalProperties: false
      required: [url, fields]
      properties:
        url:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    MapSummary:
      type: object
      additionalProperties: false
      required:
        - ulid
        - display_name
        - user_name
        - author_display_name
        - author_avatar_url
        - thumbnail_url
        - metadata_url
        - updated_at
      properties:
        ulid:
          type: string
        display_name:
          type: string
        user_name:
          type: string
        author_display_name:
          type: string
        author_avatar_url:
          type: [string, "null"]
        thumbnail_url:
          description: The CloudFront URL of the thumbnail of the complete generation with the highest tick
          type: string
        metadata_url:
          description: The CloudFront URL of the mapshot.json of the complete generation with the highest tick
          type: string
        updated_at:
          description: The creation time of the newest complete generation
          type: string
          format: date-time
    MapDetail:
      type: object
      additionalProperties: false
      required: [ulid, display_name, owner, updated_at, generations]
      properties:
        ulid:
          type: string
        display_name:
          type: string
        owner:
          $ref: "#/components/schemas/UserInfo"
        updated_at:
          description: The creation time of the newest complete generation
          type: string
          format: date-time
        generations:
          description: Sorted by tick, descending
          type: array
          items:
            $ref: "#/components/schemas/Generation"
    Generation:
      type: object
      additionalProperties: false
      required: [ulid, tick, metadata_url]
      properties:
        ulid:
          type: string
        tick:
          type: integer
        metadata_url:
          description: The CloudFront URL of the generation's mapshot.json
          type: string
    UserInfo:
      type: object
      additionalProperties: false
      required: [name, display_name, avatar_url]
      properties:
        name:
          type: string
        display_name:
          type: string
        avatar_url:
          type: [string, "null"]
    MapNameError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - error-map-name-too-long
            - error-map-name-invalid-chars
