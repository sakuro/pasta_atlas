<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Error (500) - Pasta Atlas</title>
  <!-- Served by Hanami for an unhandled exception in production; it must not depend on the app's assets. -->
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #4a4a4a;
      --strong: #363636;
      --muted: #7a7a7a;
      --link: #485fc7;
      --border: #dbdbdb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #14161a;
        --text: #b5b5b5;
        --strong: #f5f5f5;
        --muted: #8a8f99;
        --link: #8094e8;
        --border: #393d47;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 36rem;
    }

    .app-name {
      margin: 0 0 1.5rem;
      color: var(--strong);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .status {
      margin: 0;
      color: var(--muted);
      font-size: 0.875rem;
    }

    section + section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 0.5rem;
      color: var(--strong);
      font-size: 1.5rem;
      line-height: 1.3;
    }

    p {
      margin: 0 0 0.75rem;
    }

    a {
      color: var(--link);
    }
  </style>
</head>
<body>
  <main>
    <p class="app-name">Pasta Atlas</p>
    <p class="status">500 Internal Server Error</p>
    <section lang="en">
      <h1>Something went wrong</h1>
      <p>The server could not complete your request. Please try again later.</p>
      <p><a href="/">Back to the top page</a></p>
    </section>
    <section lang="ja">
      <h1>エラーが発生しました</h1>
      <p>サーバーで問題が発生し、リクエストを完了できませんでした。しばらくしてからもう一度お試しください。</p>
      <p><a href="/">トップページに戻る</a></p>
    </section>
  </main>
</body>
</html>
