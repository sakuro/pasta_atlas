name: Delete Map

on:
  workflow_dispatch:
    inputs:
      ulid:
        description: "ULID of the map to delete"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  delete-map:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-cicd
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete map
        run: |
          PAYLOAD=$(jq -nc --arg ulid "$MAP_ULID" '{task: "maps:delete", map_ulid: $ulid}')
          scripts/invoke-lambda-task "$PAYLOAD"
        env:
          MAP_ULID: ${{ inputs.ulid }}
