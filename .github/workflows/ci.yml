name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pasta_atlas
          POSTGRES_PASSWORD: pasta_atlas
          POSTGRES_DB: pasta_atlas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://pasta_atlas:pasta_atlas@localhost:5432/pasta_atlas_test

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - uses: ruby/setup-ruby@v1.344.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Compile frontend assets
        run: bundle exec hanami assets compile

      - name: Prepare test database
        run: |
          bundle exec hanami db structure load
          bundle exec hanami db seed
        env:
          HANAMI_ENV: test

      # The same commands as the spec and rubocop mise tasks; CI does not install mise.
      - name: Run RSpec
        run: bundle exec rspec --pattern 'spec/**{,/*/**}/*_spec.rb'

      - name: Run RuboCop
        run: bundle exec rubocop

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      # The steps below run the commands of the frontend:* mise tasks; CI does not install mise.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check the generated API client
        run: |
          openapi-ts
          prettier --write frontend/lib/api/gen
          git add --intent-to-add frontend/lib/api/gen
          git diff --exit-code frontend/lib/api/gen

      - name: Type check
        run: tsc --noEmit

      - name: Lint
        run: eslint frontend

      - name: Test
        run: vitest run

  actions-lock:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
