name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pasta_atlas
          POSTGRES_PASSWORD: pasta_atlas
          POSTGRES_DB: pasta_atlas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://pasta_atlas:pasta_atlas@localhost:5432/pasta_atlas_test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Compile frontend assets
        run: bundle exec hanami assets compile

      - name: Prepare test database
        run: |
          bundle exec hanami db structure load
          bundle exec hanami db seed
        env:
          HANAMI_ENV: test

      - name: Run RuboCop and RSpec
        run: bundle exec rake

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:frontend

      - name: Test
        run: npm run test:frontend -- --run
